---
- name: View all OpenShift projects
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_name: "default"

  tasks:
    - name: Ensure required Python packages are installed
      ansible.builtin.pip:
        name:
          - openshift
          - kubernetes
        state: present

    - name: Get all namespaces
      kubernetes.core.k8s_info:
        kind: Namespace
      register: ns_info

    - name: Display project names
      ansible.builtin.debug:
        msg: "{{ ns_info.resources | map(attribute='metadata.name') | list }}"