---
- name: Deploy Simple Service Application
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    namespace: "rh-consulting-apps"

  tasks:
  - name: Ensure namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ namespace_name }}"
            labels:
              name: "{{ namespace_name }}"
    - name: Deploy Kubernetes resources
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: sise-deploy
              namespace: "{{ namespace }}"
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: sise
              template:
                metadata:
                  labels:
                    app: sise
                spec:
                  containers:
                    - name: sise
                      image: quay.io/openshiftlabs/simpleservice:0.5.0
                      ports:
                        - containerPort: 9876
                      env:
                        - name: SIMPLE_SERVICE_VERSION
                          value: "0.9"

          - apiVersion: v1
            kind: Service
            metadata:
              name: sise-svc
              namespace: "{{ namespace }}"
            spec:
              selector:
                app: sise
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 9876
              type: ClusterIP

          - apiVersion: route.openshift.io/v1
            kind: Route
            metadata:
              name: simple-service
              namespace: "{{ namespace }}"
            spec:
              host: simple-service.apps.redhat.workshop.in
              path: /info
              port:
                targetPort: 9876
              to:
                kind: Service
                name: sise-svc
                weight: 100
