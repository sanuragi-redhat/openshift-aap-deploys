---
- name: Create OpenShift Project hello-world
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_name: "hello-world"

  tasks:
    - name: Create a new namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ project_name }}"

    - name: Get all namespaces
      kubernetes.core.k8s_info:
        kind: Namespace
      register: ns_info

    - name: Show all namespace names
      ansible.builtin.debug:
        msg: "{{ ns_info.resources | map(attribute='metadata.name') | list }}"

    - name: Filter for hello-world namespace
      ansible.builtin.debug:
        msg: "created: {{ ns_info.resources | map(attribute='metadata.name') | select('equalto', project_name) | list }}"